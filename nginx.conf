worker_processes auto;

events {
    worker_connections 1024;
}

http {
    log_format custom_upstream '$remote_addr - $remote_user [$time_local] '
                               '"$request" $status $body_bytes_sent '
                               '"$http_referer" "$http_user_agent" '
                               'upstream: "$upstream_addr"';

    access_log /var/log/nginx/access.log custom_upstream;

    # Docker DNS повертає адреси всіх реплік web; nginx розбирає їх при старті
    upstream fastapi_app {
        server web:8000;
        keepalive 64;
    }

    server {
        listen 80;

        # відповідь без звернення до web: межа генератора навантаження
        location = /noop {
            access_log off;
            return 204;
        }

        location / {
            proxy_pass http://fastapi_app;
            proxy_connect_timeout 1s;
            proxy_next_upstream error timeout;
            proxy_next_upstream_tries 3;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
